<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admit Card</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:20px;
}

.card{
background:white;
border:2px solid #000;
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0056A6;
color:white;
padding:15px;
text-align:center;
font-weight:bold;
font-size:24px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td{
border:1px solid black;
padding:10px;
}

.photo{
width:120px;
height:150px;
border:1px solid black;
text-align:center;
}

.btn{
margin-top:20px;
background:#0056A6;
color:white;
padding:12px 20px;
border:none;
cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

<div class="header">
JAMMU & KASHMIR SERVICES SELECTION BOARD<br>
E-ADMIT CARD FOR SKILL TEST (DEMO)
</div>

<table>

<tr>
<td><b>Candidate Name</b></td>
<td>Sandeep Kumar</td>
<td rowspan="5" class="photo">
Photo
</td>
</tr>

<tr>
<td><b>Roll Number</b></td>
<td>KMR13150176</td>
</tr>

<tr>
<td><b>Post</b></td>
<td>Junior Assistant</td>
</tr>

<tr>
<td><b>Advertisement</b></td>
<td>08 of 2025</td>
</tr>

<tr>
<td><b>Exam Centre</b></td>
<td>Srinagar</td>
</tr>

</table>

<center>
<button class="btn" onclick="window.print()">
Print Admit Card
</button>
</center>

</div>

</body>
</html>
